<title>GenAI Eğitim Masası</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Düzen: solda 150 dakikalık gündem rayı, sağda modül masası; sunum modu tam ekran tek hücre. */
:root {
  --bg: #f3f5f8; --panel: #ffffff; --ink: #18202e; --muted: #5b6577; --line: #dde2ea;
  --accent: #2b55c9; --accent-soft: #e6ecfb; --live: #a86400; --live-soft: #fdf1dc;
  --ok: #157a52; --warn: #b26a00; --bad: #c0362c;
  --code-bg: #f7f8fb; --c-key: #8a3ab9; --c-str: #1f7a3a; --c-com: #7b8494; --c-num: #b4540a; --c-fn: #2b55c9;
  --display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --rail: 300px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f131a; --panel: #161b24; --ink: #e6e9ef; --muted: #98a2b3; --line: #2a3140;
  --accent: #7d9cf5; --accent-soft: #1d2740; --live: #f0b45a; --live-soft: #2c2415;
  --ok: #4cc58f; --warn: #f0b45a; --bad: #ef7a6f;
  --code-bg: #10141c; --c-key: #c792ea; --c-str: #8fd18f; --c-com: #6f7a8c; --c-num: #f6a868; --c-fn: #8fb0ff;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0f131a; --panel: #161b24; --ink: #e6e9ef; --muted: #98a2b3; --line: #2a3140;
  --accent: #7d9cf5; --accent-soft: #1d2740; --live: #f0b45a; --live-soft: #2c2415;
  --ok: #4cc58f; --warn: #f0b45a; --bad: #ef7a6f;
  --code-bg: #10141c; --c-key: #c792ea; --c-str: #8fd18f; --c-com: #6f7a8c; --c-num: #f6a868; --c-fn: #8fb0ff;
  color-scheme: dark; }

* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 15px/1.6 var(--body); }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
a { color: var(--accent); }

.uygulama { display: grid; grid-template-columns: var(--rail) minmax(0, 1fr); min-height: 100%; }
.ray { border-right: 1px solid var(--line); background: var(--panel); padding-block: 20px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 16px; display: flex; flex-direction: column; gap: 18px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.marka { display: grid; gap: 2px; }
.marka small { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.marka strong { font: 700 20px/1.2 var(--display); text-wrap: balance; }
.gundem { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.gundem a { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 8px; padding: 8px 10px; border-radius: 8px; text-decoration: none; color: var(--ink); align-items: start; }
.gundem a:hover { background: var(--bg); }
.gundem a[aria-current="page"] { background: var(--accent-soft); }
.gundem .saat { font: 500 12px/1.5 var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; padding-top: 2px; }
.gundem .ad { font-size: 13.5px; line-height: 1.35; }
.gundem .ad b { font-family: var(--mono); font-weight: 600; font-size: 12px; margin-right: 4px; color: var(--accent); }
.gundem .ara .ad { color: var(--muted); font-style: italic; }
.ray-alt { margin-top: auto; display: grid; gap: 8px; font-size: 12.5px; color: var(--muted); }
.ray-alt label { display: grid; gap: 4px; }
.ray-alt input { border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 6px 8px; font: 12px var(--mono); }

.masa { padding-block: 28px 80px; padding-left: max(16px, 4vw); padding-right: max(16px, env(safe-area-inset-right, 0px), 4vw); min-width: 0; }
.ic { max-width: 980px; margin: 0 auto; display: grid; gap: 22px; }
.ust-bilgi { display: grid; gap: 10px; }
.eyebrow { font: 600 12px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
h1 { font: 700 clamp(26px, 3.4vw, 38px)/1.15 var(--display); margin: 0; text-wrap: balance; }
.meta { display: flex; flex-wrap: wrap; gap: 8px 18px; color: var(--muted); font-size: 14px; }
.meta span b { color: var(--ink); font-weight: 600; }
.eylemler { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.dugme { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 7px 12px; cursor: pointer; text-decoration: none; color: var(--ink); font-size: 13.5px; }
.dugme:hover { border-color: var(--accent); }
.dugme.ana { background: var(--accent); border-color: var(--accent); color: var(--panel); }
.dugme.kucuk { padding: 3px 8px; font-size: 12px; }

/* Süre sayacı */
.sayac { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 6px 8px 6px 12px; }
.sayac output { font: 600 18px/1 var(--mono); font-variant-numeric: tabular-nums; min-width: 92px; }
.sayac .bar { width: 120px; height: 6px; background: var(--bg); border-radius: 3px; overflow: hidden; }
.sayac .bar i { display: block; height: 100%; width: 0; background: var(--ok); transition: width .3s; }
.sayac[data-durum="uyari"] .bar i { background: var(--warn); }
.sayac[data-durum="asim"] .bar i { background: var(--bad); }
.sayac[data-durum="asim"] output { color: var(--bad); }

/* Bölümler */
.bolum { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; min-width: 0; }
.bolum h2 { font: 700 18px/1.3 var(--display); margin: 0 0 10px; }
.akis-izgara { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 18px; }
.akis { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.akis li { display: grid; grid-template-columns: 70px minmax(0, 1fr); gap: 10px; }
.akis .dk { font: 500 13px/1.6 var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.notlar { margin: 0; padding-left: 18px; color: var(--ink); }
.notlar li + li { margin-top: 6px; }
.nb-listesi { display: flex; flex-wrap: wrap; gap: 8px; }

/* Hücreler */
.hucreler { display: grid; gap: 14px; }
.hucre-md { line-height: 1.65; max-width: 72ch; }
.hucre-md h1 { font-size: 26px; }
.hucre-md h2, .hucre-md h3 { font-family: var(--display); margin: 8px 0 6px; }
.hucre-md table { border-collapse: collapse; font-size: 14px; }
.hucre-md th, .hucre-md td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; vertical-align: top; }
.hucre-md th { background: var(--bg); }
.hucre-md blockquote { margin: 0; padding: 6px 14px; border-left: 3px solid var(--accent); background: var(--accent-soft); border-radius: 0 8px 8px 0; }
.hucre-md code { font: 0.88em var(--mono); background: var(--code-bg); border: 1px solid var(--line); padding: 1px 5px; border-radius: 4px; }
.hucre-md pre code { border: 0; padding: 0; background: none; }
.hucre-md li input[type=checkbox] { margin-right: 8px; accent-color: var(--accent); transform: scale(1.15); }
.tablo-sar, .hucre-md pre { overflow-x: auto; }
.hucre-md pre { background: var(--code-bg); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; font: 13px/1.5 var(--mono); }

.kod { border: 1px solid var(--line); border-radius: 10px; background: var(--code-bg); overflow: hidden; min-width: 0; }
.kod-bas { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 6px 10px; border-bottom: 1px solid var(--line); font: 12px var(--mono); color: var(--muted); }
.parca pre { margin: 0; padding: 12px 14px; overflow-x: auto; font: 13px/1.55 var(--mono); }
.parca.canli { background: var(--live-soft); border-left: 3px solid var(--live); }
.parca.canli .etiket { display: flex; justify-content: space-between; gap: 8px; align-items: center; padding: 8px 12px 0; font: 600 12px/1.4 var(--mono); color: var(--live); }
.parca.canli .todo { padding: 8px 14px 12px; font: 13px var(--mono); color: var(--live); }
details.kurulum summary { cursor: pointer; padding: 8px 12px; font: 12.5px var(--mono); color: var(--muted); }

/* hljs renkleri */
.hljs-keyword, .hljs-built_in, .hljs-literal { color: var(--c-key); }
.hljs-string { color: var(--c-str); }
.hljs-comment { color: var(--c-com); font-style: italic; }
.hljs-number { color: var(--c-num); }
.hljs-title, .hljs-title.function_, .hljs-title.class_ { color: var(--c-fn); }
.hljs-meta, .hljs-attr, .hljs-type { color: var(--c-num); }

/* Genel bakış */
.zaman-cizgisi { display: flex; height: 54px; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); }
.zaman-cizgisi a { display: grid; place-items: center; text-decoration: none; color: var(--ink); font: 600 12px var(--mono); border-right: 1px solid var(--panel); background: var(--accent-soft); min-width: 0; overflow: hidden; }
.zaman-cizgisi a:nth-child(even) { background: var(--bg); }
.zaman-cizgisi a.mola { background: var(--live-soft); color: var(--live); }
.zaman-cizgisi a:hover { outline: 2px solid var(--accent); outline-offset: -2px; }
.olcek { display: flex; justify-content: space-between; font: 11px var(--mono); color: var(--muted); margin-top: 4px; }
.tablo-sar { border: 1px solid var(--line); border-radius: 10px; }
table.gundem-tablo { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 640px; }
.gundem-tablo th, .gundem-tablo td { padding: 9px 12px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
.gundem-tablo th { font: 600 11px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); background: var(--bg); }
.gundem-tablo td.num { font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.gundem-tablo tr:last-child td { border-bottom: 0; }
.rozet { display: inline-block; font: 600 11px/1.6 var(--mono); padding: 1px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.rozet.canli { background: var(--live-soft); color: var(--live); }
.klasor { font: 13px/1.7 var(--mono); background: var(--code-bg); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; overflow-x: auto; white-space: pre; margin: 0; }

/* Sunum modu */
.sunum { position: fixed; inset: 0; background: var(--bg); z-index: 50; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.sunum-bas, .sunum-alt { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--line); background: var(--panel); }
.sunum-alt { border-bottom: 0; border-top: 1px solid var(--line); }
.sunum-govde { overflow: auto; padding-block: 4vh; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.sunum-govde > div { max-width: 1100px; margin: 0 auto; font-size: clamp(16px, 1.6vw, 22px); }
.sunum-govde .parca pre, .sunum-govde .hucre-md pre { font-size: clamp(13px, 1.25vw, 18px); }
.sunum-govde .hucre-md { max-width: none; }
.ilerleme { flex: 1; min-width: 120px; height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.ilerleme i { display: block; height: 100%; background: var(--accent); }

@media (max-width: 860px) {
  .uygulama { grid-template-columns: minmax(0, 1fr); }
  .ray { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .akis-izgara { grid-template-columns: minmax(0, 1fr); }
  .masa { padding-left: max(16px, env(safe-area-inset-left, 0px)); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="uygulama">
  <aside class="ray" aria-label="Gündem">
    <div class="marka"><small>Eğitim Masası · 2 sa 30 dk</small><strong id="egitim-adi">Üretken Yapay Zeka ile Karar Destek</strong></div>
    <ul class="gundem" id="gundem"></ul>
    <div class="ray-alt">
      <label for="repo-girdi">GitHub reposu (Colab linkleri için)
        <input id="repo-girdi" placeholder="kullanici/repo" autocomplete="off">
      </label>
      <span>Sunum modunda ← → ile ilerleyin, Esc ile çıkın.</span>
    </div>
  </aside>
  <main class="masa"><div class="ic" id="masa"></div></main>
</div>

<div class="sunum" id="sunum" hidden>
  <div class="sunum-bas">
    <strong id="sunum-baslik"></strong>
    <div class="ilerleme"><i id="sunum-ilerleme"></i></div>
    <span id="sunum-sayi" class="rozet"></span>
    <button class="dugme kucuk" id="sunum-kapat" type="button">Kapat (Esc)</button>
  </div>
  <div class="sunum-govde"><div id="sunum-govde"></div></div>
  <div class="sunum-alt">
    <button class="dugme" id="sunum-geri" type="button">← Önceki</button>
    <div class="sayac" id="sunum-sayac"></div>
    <button class="dugme ana" id="sunum-ileri" type="button">Sonraki →</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/csharp.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/typescript.min.js"></script>
<script src="icerik.js"></script>
<script>
(function () {
  const VERI = window.EGITIM;
  const $ = (s, k = document) => k.querySelector(s);
  const kaydet = (a, d) => { try { localStorage.setItem(a, JSON.stringify(d)); } catch (e) {} };
  const oku = (a, v) => { try { const d = localStorage.getItem(a); return d === null ? v : JSON.parse(d); } catch (e) { return v; } };
  const kacis = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  if (!VERI) { $("#masa").innerHTML = '<div class="bolum"><h2>İçerik bulunamadı</h2><p>icerik.js yüklenemedi. Önce <code>python3 _kaynak/build.py</code> çalıştırın.</p></div>'; return; }

  $("#egitim-adi").textContent = VERI.ayarlar.egitim_adi;
  const repoGirdi = $("#repo-girdi");
  repoGirdi.value = oku("repo", VERI.ayarlar.github_repo);
  const repo = () => repoGirdi.value.trim() || VERI.ayarlar.github_repo;
  const colab = (yol) => `https://colab.research.google.com/github/${repo()}/blob/${VERI.ayarlar.dal}/${yol}`;
  repoGirdi.addEventListener("change", () => { kaydet("repo", repoGirdi.value.trim()); goster(); });

  const md = (src) => (window.marked ? marked.parse(src, { gfm: true }) : `<pre>${kacis(src)}</pre>`);
  const renklendir = (kod, dil) => {
    if (!window.hljs) return kacis(kod);
    const d = { python: "python", csharp: "csharp", ts: "typescript", tsx: "typescript", bash: "bash", text: "plaintext" }[dil] || dil;
    try { return hljs.getLanguage(d) ? hljs.highlight(kod, { language: d }).value : kacis(kod); } catch (e) { return kacis(kod); }
  };

  // ---------- Gündem rayı
  const moduller = VERI.moduller;
  const gundem = $("#gundem");
  gundem.innerHTML = `<li><a href="#genel" data-id="genel"><span class="saat">Plan</span><span class="ad">Genel bakış ve klasörler</span></a></li>` +
    moduller.map((m) => `<li class="${m.id === "ara" ? "ara" : ""}"><a href="#${m.id}" data-id="${m.id}"><span class="saat">${kacis(m.zaman.split("–")[0])}</span><span class="ad"><b>${kacis(m.kod)}</b>${kacis(m.baslik)}</span></a></li>`).join("");

  // ---------- Süre sayacı
  const sayaclar = {};
  function sayacHtml(m) {
    return `<output>00:00 / ${String(m.sure).padStart(2, "0")}:00</output><div class="bar"><i></i></div>
      <button class="dugme kucuk" data-sayac="baslat" type="button">Başlat</button><button class="dugme kucuk" data-sayac="sifirla" type="button">Sıfırla</button>`;
  }
  function sayacBagla(kutu, m) {
    if (!m.sure) { kutu.hidden = true; return; }
    kutu.hidden = false;
    kutu.innerHTML = sayacHtml(m);
    const s = sayaclar[m.id] || (sayaclar[m.id] = { gecen: 0, calisiyor: false, son: 0 });
    const ciz = () => {
      const top = s.gecen + (s.calisiyor ? Date.now() - s.son : 0);
      const sn = Math.floor(top / 1000), plan = m.sure * 60, oran = sn / plan;
      kutu.querySelector("output").textContent = `${String(Math.floor(sn / 60)).padStart(2, "0")}:${String(sn % 60).padStart(2, "0")} / ${String(m.sure).padStart(2, "0")}:00`;
      kutu.querySelector(".bar i").style.width = Math.min(100, oran * 100) + "%";
      kutu.dataset.durum = oran >= 1 ? "asim" : oran >= 0.8 ? "uyari" : "normal";
      kutu.querySelector('[data-sayac="baslat"]').textContent = s.calisiyor ? "Duraklat" : (s.gecen ? "Devam" : "Başlat");
    };
    kutu.onclick = (e) => {
      const b = e.target.closest("[data-sayac]"); if (!b) return;
      if (b.dataset.sayac === "baslat") { if (s.calisiyor) { s.gecen += Date.now() - s.son; s.calisiyor = false; } else { s.son = Date.now(); s.calisiyor = true; } }
      else { s.gecen = 0; s.calisiyor = false; }
      ciz();
    };
    clearInterval(kutu._t); kutu._t = setInterval(ciz, 500); ciz();
  }

  // ---------- Hücre çizimi
  let katilimciGorunumu = oku("katilimci", false);
  function hucreHtml(h, mid, i) {
    if (h.tur === "md") return `<div class="hucre-md" data-hucre="${mid}-${i}">${md(h.kaynak)}</div>`;
    const dil = h.dil || "python";
    const govde = h.parcalar.map((p) => {
      if (!p.canli) return p.kod.trim() ? `<div class="parca"><pre><code>${renklendir(p.kod, dil)}</code></pre></div>` : "";
      return `<div class="parca canli"><div class="etiket"><span>✍️ Canlı kodlama · ${kacis(p.ipucu)}</span></div>` +
        (katilimciGorunumu ? `<div class="todo"># TODO: ${kacis(p.ipucu)}<br>...</div>` : `<pre><code>${renklendir(p.kod, dil)}</code></pre>`) + `</div>`;
    }).join("");
    const kopya = h.parcalar.map((p) => p.kod).join("\n");
    const kutu = `<div class="kod"><div class="kod-bas"><span>${dil}</span><button class="dugme kucuk" type="button" data-kopya="${kacis(kopya)}">Kopyala</button></div>${govde}</div>`;
    return h.kurulum ? `<details class="kurulum kod"><summary>⚙️ Ortam hazırlık hücresi (Colab'da repo klonlar, paket kurar, API anahtarını yükler)</summary>${govde}</details>` : kutu;
  }

  function checkboxBagla(kok, mid) {
    const durum = oku("liste-" + mid, {});
    kok.querySelectorAll('.hucre-md li input[type=checkbox]').forEach((c, i) => {
      c.disabled = false; c.id = `liste-${mid}-${i}`; c.checked = !!durum[i];
      c.addEventListener("change", () => { durum[i] = c.checked; kaydet("liste-" + mid, durum); });
    });
  }

  document.addEventListener("click", async (e) => {
    const b = e.target.closest("[data-kopya]"); if (!b) return;
    try { await navigator.clipboard.writeText(b.dataset.kopya); b.textContent = "Kopyalandı"; }
    catch (err) { const r = document.createRange(); r.selectNodeContents(b.closest(".kod").querySelector(".parca") || b); getSelection().removeAllRanges(); getSelection().addRange(r); b.textContent = "Seçildi, ⌘C"; }
    setTimeout(() => (b.textContent = "Kopyala"), 1500);
  });

  // ---------- Sayfalar
  function genelBakis() {
    const toplam = moduller.reduce((a, m) => a + m.sure, 0);
    return `
      <div class="ust-bilgi"><span class="eyebrow">Eğitim planı · ${toplam} dakika</span>
        <h1>${kacis(VERI.ayarlar.egitim_adi)}</h1>
        <div class="meta"><span>Senaryo: <b>${kacis(VERI.ayarlar.sirket)}</b></span><span>Ortam: <b>Google Colab + .NET/React</b></span></div></div>
      <section class="bolum"><h2>Zaman çizelgesi</h2>
        <div class="zaman-cizgisi">${moduller.filter((m) => m.sure).map((m) => `<a href="#${m.id}" class="${m.id === "ara" ? "mola" : ""}" style="flex:${m.sure}" title="${kacis(m.baslik)}">${kacis(m.kod)}</a>`).join("")}</div>
        <div class="olcek"><span>0:00</span><span>0:30</span><span>1:00</span><span>1:30</span><span>2:00</span><span>2:30</span></div></section>
      <section class="bolum"><h2>Gündem</h2><div class="tablo-sar"><table class="gundem-tablo">
        <thead><tr><th>Zaman</th><th>Süre</th><th>Modül</th><th>Format</th><th>Demo çıktısı</th></tr></thead>
        <tbody>${moduller.filter((m) => m.sure).map((m) => `<tr><td class="num">${kacis(m.zaman)}</td><td class="num">${m.sure} dk</td><td><a href="#${m.id}">${kacis(m.kod)} · ${kacis(m.baslik)}</a></td><td><span class="rozet ${/Canlı/.test(m.format) ? "canli" : ""}">${kacis(m.format)}</span></td><td>${kacis(m.demo)}</td></tr>`).join("")}</tbody></table></div></section>
      <section class="bolum"><h2>Klasör yapısı</h2>
<pre class="klasor">MBT/
├── 00_Kurulum/            eğitim öncesi ortam kontrolü
├── M1_GenAI_Karar/        M1_baslangic.ipynb · M1_cozum.ipynb

      <section class="bolum"><h2>Nasıl kullanılır?</h2><div class="hucre-md">${md(`1. Repoyu GitHub'a yükleyin ve sol alttaki kutuya \`kullanici/repo\` yazın. Bu adımdan sonra tüm **Colab'da aç** bağlantıları çalışır.
2. Katılımcılar **başlangıç** notebook'unu açar (\`Dosya → Drive'a kopya kaydet\`). Canlı kodlama bölümleri boştur (\`# TODO\`).
3. Eğitmen bu sayfada modülü açar, **Sunum modu** ile hücre hücre ilerler. Turuncu bloklar canlı yazılacak kısımlardır.
4. **Katılımcı görünümü** anahtarı turuncu blokların çözümünü gizler. Önce birlikte düşünür, sonra yazarsınız.
5. Takılırsanız **çözüm** notebook'una geçin; M6'da \`api/\` ve \`web/\` klasörlerindeki hazır koda geçin.`)}</div></section>`;
  }

  function modulSayfasi(m) {
    const nb = m.notebooklar.map((n) => `<a class="dugme ${/Başlangıç|Notebook/.test(n.etiket) ? "ana" : ""}" href="${colab(n.yol)}" target="_blank" rel="noopener">Colab'da aç · ${kacis(n.etiket)}</a>`).join("");
    const canliVar = m.hucreler.some((h) => h.parcalar && h.parcalar.some((p) => p.canli));
    return `
      <div class="ust-bilgi"><span class="eyebrow">${kacis(m.kod)} · ${kacis(m.zaman)}</span><h1>${kacis(m.baslik)}</h1>
        <div class="meta"><span>Süre <b>${m.sure} dk</b></span><span>Format <b>${kacis(m.format)}</b></span><span>Demo çıktısı <b>${kacis(m.demo)}</b></span></div></div>
      <div class="eylemler">
        ${m.hucreler.length ? `<button class="dugme ana" type="button" id="sunum-ac">▶ Sunum modu</button>` : ""}
        <div class="sayac" id="sayfa-sayac"></div>
        ${canliVar ? `<label class="dugme" for="katilimci"><input type="checkbox" id="katilimci" ${katilimciGorunumu ? "checked" : ""}> Katılımcı görünümü</label>` : ""}
      </div>
      <section class="bolum akis-izgara">
        <div><h2>Akış</h2><ol class="akis">${m.akis.map(([a, b]) => `<li><span class="dk">${kacis(a)}</span><span>${kacis(b)}</span></li>`).join("")}</ol></div>
        <div><h2>Eğitmen notları</h2>${m.notlar.length ? `<ul class="notlar">${m.notlar.map((n) => `<li>${kacis(n)}</li>`).join("")}</ul>` : `<p style="color:var(--muted)">Bu bölüm için not yok.</p>`}</div>
      </section>
      ${nb ? `<section class="bolum"><h2>Notebook'lar</h2><div class="nb-listesi">${nb}</div></section>` : ""}
      ${m.hucreler.length ? `<section class="hucreler" id="hucreler">${m.hucreler.map((h, i) => hucreHtml(h, m.id, i)).join("")}</section>` : ""}`;
  }

  // ---------- Sunum modu
  let sunumModul = null, sunumIndeks = 0;
  const sunum = $("#sunum");
  function sunumCiz() {
    const h = sunumModul.hucreler;
    $("#sunum-govde").innerHTML = hucreHtml(h[sunumIndeks], sunumModul.id, sunumIndeks);
    checkboxBagla($("#sunum-govde"), sunumModul.id);
    $("#sunum-sayi").textContent = `${sunumIndeks + 1} / ${h.length}`;
    $("#sunum-ilerleme").style.width = ((sunumIndeks + 1) / h.length) * 100 + "%";
    $("#sunum-geri").disabled = sunumIndeks === 0;
    $("#sunum-ileri").disabled = sunumIndeks === h.length - 1;
    $(".sunum-govde").scrollTop = 0;
  }
  function sunumAc(m) {
    sunumModul = m; sunumIndeks = oku("konum-" + m.id, 0);
    if (sunumIndeks >= m.hucreler.length) sunumIndeks = 0;
    $("#sunum-baslik").textContent = `${m.kod} · ${m.baslik}`;
    sayacBagla($("#sunum-sayac"), m);
    sunum.hidden = false; sunumCiz(); $("#sunum-ileri").focus();
  }
  function sunumGit(d) {
    if (!sunumModul) return;
    sunumIndeks = Math.max(0, Math.min(sunumModul.hucreler.length - 1, sunumIndeks + d));
    kaydet("konum-" + sunumModul.id, sunumIndeks); sunumCiz();
  }
  function sunumKapat() { sunum.hidden = true; const m = sunumModul; sunumModul = null; if (m) sayacBagla($("#sayfa-sayac"), m); }
  $("#sunum-geri").onclick = () => sunumGit(-1);
  $("#sunum-ileri").onclick = () => sunumGit(1);
  $("#sunum-kapat").onclick = sunumKapat;
  document.addEventListener("keydown", (e) => {
    if (sunum.hidden) return;
    if (e.key === "ArrowRight" || e.key === "PageDown" || (e.key === " " && e.target.tagName !== "BUTTON")) { e.preventDefault(); sunumGit(1); }
    else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); sunumGit(-1); }
    else if (e.key === "Escape") sunumKapat();
  });

  // ---------- Yönlendirme
  function goster() {
    const id = (location.hash || "#genel").slice(1);
    const m = moduller.find((x) => x.id === id);
    gundem.querySelectorAll("a").forEach((a) => { if (a.dataset.id === (m ? m.id : "genel")) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
    const masa = $("#masa");
    if (!m) { masa.innerHTML = genelBakis(); return; }
    masa.innerHTML = modulSayfasi(m);
    sayacBagla($("#sayfa-sayac"), m);
    checkboxBagla(masa, m.id);
    const acBtn = $("#sunum-ac"); if (acBtn) acBtn.onclick = () => sunumAc(m);
    const kg = $("#katilimci");
    if (kg) kg.onchange = () => { katilimciGorunumu = kg.checked; kaydet("katilimci", katilimciGorunumu); $("#hucreler").innerHTML = m.hucreler.map((h, i) => hucreHtml(h, m.id, i)).join(""); checkboxBagla(masa, m.id); };
    window.scrollTo(0, 0);
  }
  window.addEventListener("hashchange", () => { if (!sunum.hidden) sunumKapat(); goster(); });
  goster();
})();
</script>
